name: Release packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to package (tag or commit SHA)
        required: true
        type: string
      version:
        description: GUI version without the v prefix
        required: true
        type: string
      wsfs_core_tag:
        description: Published Kodecable/wsfs-core release tag
        required: true
        type: string
      release_tag:
        description: Optional tag for the draft GUI GitHub Release; leave empty to publish artifacts only
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      ref: ${{ steps.values.outputs.ref }}
      version: ${{ steps.values.outputs.version }}
      core_tag: ${{ steps.values.outputs.core_tag }}
      release_tag: ${{ steps.values.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
      - id: values
        shell: bash
        run: |
          set -euo pipefail
          source release/versions.env
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
            ref="${GITHUB_SHA}"
            version="${GITHUB_REF_NAME#v}"
            core_tag="${WSFS_CORE_TAG}"
            release_tag="${GITHUB_REF_NAME}"
          else
            ref="${{ inputs.ref }}"
            version="${{ inputs.version }}"
            core_tag="${{ inputs.wsfs_core_tag }}"
            release_tag="${{ inputs.release_tag }}"
            if [[ -n "${release_tag}" && ! "${release_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo 'release_tag must be empty or vX.Y.Z' >&2
              exit 1
            fi
          fi
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "core_tag=${core_tag}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"

  linux-appimage:
    needs: resolve
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          submodules: recursive
      - uses: docker/setup-buildx-action@v3
      - name: Build the Arch packaging image
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          file: release/linux/Containerfile
          tags: wsfs-gui-appimage-builder:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build AppImage
        shell: bash
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp/wsfs-gui-home \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            wsfs-gui-appimage-builder:ci \
            bash release/linux/build-appimage.sh "${{ needs.resolve.outputs.version }}" "${{ needs.resolve.outputs.core_tag }}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: dist/*.AppImage

  windows-installer:
    needs: resolve
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          submodules: recursive
      - name: Install Qt SDK
        shell: pwsh
        run: |
          python -m pip install 'git+https://github.com/miurahr/aqtinstall.git@refs/pull/1000/head'
          aqt version
          aqt list-qt windows desktop
          aqt install-qt windows desktop 6.11.1 win64_msvc2022_64 --outputdir "$env:RUNNER_TEMP/Qt"
          if ($LASTEXITCODE -ne 0) { throw "Installing Qt SDK failed" }
          Add-Content -Path $env:GITHUB_ENV -Value "WSFS_GUI_QT_ROOT=$env:RUNNER_TEMP/Qt"
      - uses: xmake-io/github-action-setup-xmake@v1
      - name: Install Inno Setup 7
        shell: pwsh
        run: |
          $innoVersion = "7.0.2"
          $innoInstaller = Join-Path $env:RUNNER_TEMP "innosetup-$innoVersion-x64.exe"
          $innoRoot = Join-Path $env:RUNNER_TEMP "inno7"
          Invoke-WebRequest `
            -Uri "https://github.com/jrsoftware/issrc/releases/download/is-7_0_2/innosetup-$innoVersion-x64.exe" `
            -OutFile $innoInstaller
          $arguments = @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/SP-",
            "/DIR=$innoRoot"
          )
          $process = Start-Process -FilePath $innoInstaller -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installing Inno Setup 7 failed with code $($process.ExitCode)" }
          $iscc = Join-Path $innoRoot "ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup 7 ISCC.exe was not found at $iscc" }
          (Get-Item $iscc).VersionInfo.ProductVersion
          Add-Content -Path $env:GITHUB_ENV -Value "WSFS_GUI_INNO_ROOT=$innoRoot"
      - name: Build Windows installer
        shell: pwsh
        run: |
          release/windows/build-installer.ps1 `
            -GuiVersion "${{ needs.resolve.outputs.version }}" `
            -CoreTag "${{ needs.resolve.outputs.core_tag }}" `
            -QtRoot "$env:WSFS_GUI_QT_ROOT" `
            -InnoSetupRoot "$env:WSFS_GUI_INNO_ROOT"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist-installer/*.exe

  create-draft-release:
    needs: [resolve, linux-appimage, windows-installer]
    if: needs.resolve.outputs.release_tag != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        name: Download Linux AppImage
        with:
          name: linux-appimage
          path: release-assets/linux-appimage
      - uses: actions/download-artifact@v4
        name: Download Windows installer
        with:
          name: windows-installer
          path: release-assets/windows-installer
      - name: Create checksums
        shell: bash
        run: |
          cd release-assets
          find . -type f \( -name '*.AppImage' -o -name '*.exe' \) -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - name: Create or update draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.release_tag }}
          draft: true
          prerelease: false
          generate_release_notes: true
          overwrite_files: true
          files: |
            release-assets/**/*.AppImage
            release-assets/**/*.exe
            release-assets/SHA256SUMS.txt
